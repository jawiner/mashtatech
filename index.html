<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mashtech</title>
<link rel="icon" type="image/png" href="assets/favicon-mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Frank+Ruhl+Libre:wght@300;400;500;700&family=Assistant:wght@200;300;400;500;600&family=IBM+Plex+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0E100E;}
a{color:inherit;text-decoration:none;}
a:hover{color:inherit;}
*:focus-visible{outline:2px solid #C9F7C5;outline-offset:3px;}
::selection{background:#C9F7C5;color:#0E100E;}
@keyframes mUp{from{opacity:0;transform:translateY(24px);}to{opacity:1;transform:translateY(0);}}
@keyframes mMark{from{transform:scaleX(0);opacity:.4;}to{transform:scaleX(1);opacity:1;}}
@keyframes mBlink{0%,100%{opacity:1;}50%{opacity:.18;}}
@keyframes mScan{0%{transform:translateY(-10%);opacity:0;}10%{opacity:.7;}90%{opacity:.3;}100%{transform:translateY(2600%);opacity:0;}}
@keyframes mSheen{0%{transform:translateX(-140%) skewX(-16deg);}60%,100%{transform:translateX(360%) skewX(-16deg);}}
@keyframes mKen{from{transform:scale(1.01);}to{transform:scale(1.1);}}
@keyframes mFab{0%,100%{box-shadow:0 0 0 0 rgba(201,247,197,.35);}50%{box-shadow:0 0 0 10px rgba(201,247,197,0);}}
@keyframes mFloat{0%,100%{transform:translateY(0);}50%{transform:translateY(-8px);}}
@keyframes mHeroScan{0%{transform:translateY(0);opacity:0;}8%{opacity:.85;}70%{opacity:.3;}100%{transform:translateY(100vh);opacity:0;}}
.hoverline:hover{color:#C9F7C5;border-bottom-color:#C9F7C5;}
.btn-lang:hover{border-color:#C9F7C5;color:#C9F7C5;}
.btn-cta:hover{background:#E9EBE8;}
.btn-cta-lift:hover{background:#E9EBE8;transform:translateY(-2px);}
.btn-outline:hover{border-color:#C9F7C5;color:#C9F7C5;}
.service-cell:hover{background:rgba(233,235,232,.03);}
.work-arrow:hover{transform:scale(1.08);}
.carousel-nav:hover{background:#C9F7C5;border-color:#C9F7C5;color:#0E100E;}
.testimonial-nav:hover{background:#C9F7C5;border-color:#C9F7C5;color:#0E100E;}
.social-icon:hover{background:#C9F7C5;border-color:#C9F7C5;}
.footer-link:hover{color:#C9F7C5;opacity:1;}
.contact-dark:hover{transform:translateY(-2px);}
.contact-outline:hover{background:#0E100E;border-color:#0E100E;color:#C9F7C5;}
.fab:hover{transform:scale(1.07);}
[data-reveal]{transition:opacity .8s cubic-bezier(.2,.8,.2,1),transform .8s cubic-bezier(.2,.8,.2,1);}

@media (max-width: 760px) {
  #navLinks{display:none !important;}
  #nav{padding:16px 20px !important;gap:16px !important;}
  #top{padding:96px 20px 56px !important;}
  #top h1{font-size:38px !important;margin-top:22px !important;}
  #top p{font-size:16px !important;}
  #top [data-reveal]:last-child > div{flex-direction:column !important;align-items:stretch !important;}
  #top [data-reveal]:last-child a{justify-content:center !important;}
  #techStrip{padding:14px 20px !important;gap:20px !important;overflow-x:auto !important;white-space:nowrap !important;font-size:11px !important;}
  #techStrip span:last-child{margin-inline-start:0 !important;}
  #services{padding:72px 20px 0 !important;}
  #process{padding:72px 20px 0 !important;}
  #work{padding-top:72px !important;}
  #work > div:first-child{padding:0 20px !important;}
  #aboutInner{padding:56px 20px !important;}
  #contactInner{padding:56px 20px !important;}
  #siteFooter{padding:48px 20px 20px !important;}
  #copyrightWrap{padding:0 20px 32px !important;}
  #services h2, #work h2, #process h2, #about h2{font-size:28px !important;}
  #services > div[style*="grid-template-columns:repeat(4"]{grid-template-columns:1fr !important;}
  #services > div[style*="grid-template-columns:repeat(4"] > div{border-inline-end:none !important;border-bottom:1px solid rgba(233,235,232,.14);}
  #tiltZone{height:300px !important;perspective:none !important;}
  #testimonialsSection{margin-top:72px !important;padding:0 20px !important;}
  #testimonialsSection > div[style*="grid-template-columns:300px"]{grid-template-columns:1fr !important;}
  #testimonialsSection > div[style*="grid-template-columns:300px"] > div:first-child{border-inline-end:none !important;border-bottom:1px solid rgba(233,235,232,.14);padding-inline-end:0 !important;}
  #testimonialsSection > div[style*="grid-template-columns:300px"] > div:last-child{padding-inline-start:0 !important;}
  #testimonialsSection p[style*="font-size:30px"]{font-size:22px !important;}
  #stepsWrap{grid-template-columns:1fr !important;row-gap:40px !important;}
  #stepsWrap > div[style*="top:244px"]{display:none !important;}
  #stepsContainer > div{cursor:default !important;}
  #about h2{font-size:26px !important;}
  #aboutInner > div[style*="grid-template-columns:minmax(0,1.05fr)"]{grid-template-columns:1fr !important;}
  #aboutInner > div[style*="grid-template-columns:minmax(0,1.05fr)"] > div:first-child{border-inline-end:none !important;padding-inline-end:0 !important;padding-bottom:28px !important;}
  #aboutInner > div[style*="grid-template-columns:minmax(0,1.05fr)"] > div:last-child{padding-inline-start:0 !important;padding-top:28px !important;border-top:1px solid rgba(26,28,26,.14);}
  #about h3{font-size:28px !important;}
  #contact h2{font-size:38px !important;}
  #contactInner > div[style*="grid-template-columns:minmax(0,1fr) auto"]{grid-template-columns:1fr !important;gap:24px !important;}
  #contactInner > div[style*="grid-template-columns:minmax(0,1fr) auto"] > div:last-child{flex-direction:column !important;align-items:stretch !important;}
  #contactInner > div:last-child{flex-wrap:wrap !important;gap:10px 24px !important;}
  #siteFooter{grid-template-columns:1fr !important;gap:32px !important;}
}
</style>
</head>
<body>
<div id="root" dir="rtl" lang="he" style="background:#0E100E;color:#E9EBE8;font-family:'Assistant',sans-serif;font-weight:300;min-height:100vh;position:relative;overflow-x:hidden;">

  <canvas id="field" aria-hidden="true" style="position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:0;display:block;"></canvas>
  <div aria-hidden="true" style="position:fixed;inset-inline:0;top:0;height:1px;background:linear-gradient(90deg,transparent,rgba(201,247,197,.6),transparent);pointer-events:none;z-index:0;animation:mHeroScan 11s cubic-bezier(.5,0,.5,1) infinite;"></div>

  <nav id="nav" style="position:sticky;top:0;z-index:60;display:flex;align-items:center;gap:40px;padding:22px 56px;border-bottom:1px solid rgba(233,235,232,.10);background:rgba(14,16,14,0);transition:background .4s ease,border-color .4s ease,padding .4s ease;">
    <a href="#top" style="font-family:'Playfair Display',serif;font-size:23px;font-weight:600;letter-spacing:-.01em;display:inline-flex;align-items:center;gap:10px;">
      <span style="width:7px;height:7px;background:#C9F7C5;display:inline-block;animation:mBlink 3.4s ease-in-out infinite;"></span>Mashtech
    </a>
    <div id="navLinks" style="display:flex;gap:30px;font-size:14px;font-weight:400;opacity:.72;margin-inline-start:8px;">
      <a href="#services" class="hoverline" data-t="nav_services" style="padding-bottom:3px;border-bottom:1px solid transparent;transition:color .25s,border-color .25s;"></a>
      <a href="#work" class="hoverline" data-t="nav_work" style="padding-bottom:3px;border-bottom:1px solid transparent;transition:color .25s,border-color .25s;"></a>
      <a href="#process" class="hoverline" data-t="nav_process" style="padding-bottom:3px;border-bottom:1px solid transparent;transition:color .25s,border-color .25s;"></a>
      <a href="#about" class="hoverline" data-t="nav_about" style="padding-bottom:3px;border-bottom:1px solid transparent;transition:color .25s,border-color .25s;"></a>
    </div>
    <div style="margin-inline-start:auto;display:flex;align-items:center;gap:18px;">
      <button id="langToggle" class="btn-lang" data-t="lang_toggle" style="background:none;border:1px solid rgba(233,235,232,.20);color:#E9EBE8;font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.10em;padding:9px 13px;cursor:pointer;transition:border-color .25s,color .25s;"></button>
      <a href="#contact" class="btn-cta" style="display:inline-flex;align-items:center;gap:10px;background:#C9F7C5;color:#0E100E;padding:11px 20px;font-size:14px;font-weight:600;transition:background .25s;"><span data-t="nav_cta"></span> <span style="font-family:'IBM Plex Mono',monospace;">↖</span></a>
    </div>
  </nav>

  <section id="top" style="position:relative;z-index:1;padding:118px 56px 92px;overflow:hidden;">
    <div style="position:absolute;inset:0;pointer-events:none;z-index:0;display:grid;grid-template-columns:repeat(12,1fr);">
      <span style="border-inline-start:1px solid rgba(233,235,232,.045);"></span><span style="border-inline-start:1px solid rgba(233,235,232,.045);"></span><span style="border-inline-start:1px solid rgba(233,235,232,.045);"></span><span style="border-inline-start:1px solid rgba(233,235,232,.045);"></span><span style="border-inline-start:1px solid rgba(233,235,232,.045);"></span><span style="border-inline-start:1px solid rgba(233,235,232,.045);"></span><span style="border-inline-start:1px solid rgba(233,235,232,.045);"></span><span style="border-inline-start:1px solid rgba(233,235,232,.045);"></span><span style="border-inline-start:1px solid rgba(233,235,232,.045);"></span><span style="border-inline-start:1px solid rgba(233,235,232,.045);"></span><span style="border-inline-start:1px solid rgba(233,235,232,.045);"></span><span style="border-inline-start:1px solid rgba(233,235,232,.045);"></span>
    </div>
    <div style="position:relative;z-index:1;max-width:1400px;margin:0 auto;">
      <div data-reveal style="display:flex;align-items:center;gap:14px;font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#C9F7C5;">
        <span style="width:6px;height:6px;background:#C9F7C5;display:inline-block;"></span><span data-t="hero_kicker"></span>
      </div>
      <h1 data-reveal style="font-family:'Frank Ruhl Libre',serif;font-weight:300;font-size:100px;line-height:1.04;letter-spacing:-.03em;margin:34px 0 0;max-width:17ch;">
        <span id="heroTitleA"></span><span style="white-space:nowrap;"><span style="position:relative;display:inline-block;"><span style="position:absolute;inset-inline-start:-10px;inset-inline-end:-10px;bottom:.1em;height:.76em;background:#C9F7C5;z-index:0;"></span><span id="heroTitleMark" style="position:relative;z-index:1;color:#0E100E;"></span></span></span> <span id="heroTitleB"></span>
      </h1>
      <div data-reveal style="margin-top:54px;">
        <p data-t="hero_sub" style="font-size:19px;line-height:1.7;margin:0;opacity:.68;max-width:56ch;"></p>
        <div style="display:flex;gap:12px;margin-top:44px;">
          <a href="#contact" class="btn-cta-lift" data-t="hero_cta_primary" style="display:inline-flex;align-items:center;gap:12px;background:#C9F7C5;color:#0E100E;padding:17px 30px;font-size:16px;font-weight:600;transition:background .25s,transform .35s cubic-bezier(.2,.8,.2,1);"></a>
          <a href="#work" class="btn-outline" data-t="hero_cta_secondary" style="display:inline-flex;align-items:center;gap:12px;border:1px solid rgba(233,235,232,.24);padding:17px 30px;font-size:16px;font-weight:400;transition:border-color .25s,color .25s;"></a>
        </div>
      </div>
    </div>
  </section>

  <div id="techStrip" style="position:relative;z-index:1;border-top:1px solid rgba(233,235,232,.12);border-bottom:1px solid rgba(233,235,232,.12);padding:20px 56px;display:flex;gap:52px;font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.12em;text-transform:uppercase;opacity:.55;">
    <span>React</span><span>Next.js</span><span>Claude / OpenAI</span><span>Supabase</span><span>Vercel</span>
    <span id="location" style="margin-inline-start:auto;"></span>
  </div>

  <section id="services" style="position:relative;z-index:1;max-width:1400px;margin:0 auto;padding:130px 56px 0;">
    <div data-reveal style="display:flex;align-items:baseline;gap:20px;">
      <span data-t="nav_services" data-prefix="01 / " style="font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#C9F7C5;"></span>
      <h2 data-t="services_title" style="font-family:'Frank Ruhl Libre',serif;font-size:46px;font-weight:300;letter-spacing:-.02em;margin:0;"></h2>
    </div>
    <div style="margin-top:64px;border-top:1px solid rgba(233,235,232,.14);display:grid;grid-template-columns:repeat(4,1fr);">
      <div data-reveal class="service-cell" style="padding:40px 32px 52px;border-inline-end:1px solid rgba(233,235,232,.14);transition:background .4s;">
        <span style="font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.14em;color:#C9F7C5;">01</span>
        <h3 data-t="service1_title" style="font-family:'Frank Ruhl Libre',serif;font-size:24px;font-weight:400;margin:22px 0 0;letter-spacing:-.01em;"></h3>
        <p data-t="service1_body" style="font-size:15px;line-height:1.75;opacity:.62;margin:14px 0 0;"></p>
      </div>
      <div data-reveal class="service-cell" style="padding:40px 32px 52px;border-inline-end:1px solid rgba(233,235,232,.14);transition:background .4s;">
        <span style="font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.14em;color:#C9F7C5;">02</span>
        <h3 data-t="service2_title" style="font-family:'Frank Ruhl Libre',serif;font-size:24px;font-weight:400;margin:22px 0 0;letter-spacing:-.01em;"></h3>
        <p data-t="service2_body" style="font-size:15px;line-height:1.75;opacity:.62;margin:14px 0 0;"></p>
      </div>
      <div data-reveal class="service-cell" style="padding:40px 32px 52px;border-inline-end:1px solid rgba(233,235,232,.14);transition:background .4s;">
        <span style="font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.14em;color:#C9F7C5;">03</span>
        <h3 data-t="service3_title" style="font-family:'Frank Ruhl Libre',serif;font-size:24px;font-weight:400;margin:22px 0 0;letter-spacing:-.01em;"></h3>
        <p data-t="service3_body" style="font-size:15px;line-height:1.75;opacity:.62;margin:14px 0 0;"></p>
      </div>
      <div data-reveal class="service-cell" style="padding:40px 32px 52px;transition:background .4s;">
        <span style="font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.14em;color:#C9F7C5;">04</span>
        <h3 data-t="service4_title" style="font-family:'Frank Ruhl Libre',serif;font-size:24px;font-weight:400;margin:22px 0 0;letter-spacing:-.01em;"></h3>
        <p data-t="service4_body" style="font-size:15px;line-height:1.75;opacity:.62;margin:14px 0 0;"></p>
      </div>
    </div>
    <div style="height:1px;background:rgba(233,235,232,.14);"></div>
  </section>

  <section id="work" style="position:relative;z-index:1;padding:130px 0 0;overflow:hidden;">
    <div style="max-width:1400px;margin:0 auto;padding:0 56px;display:flex;align-items:baseline;gap:20px;">
      <span data-t="nav_work" data-prefix="02 / " style="font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#C9F7C5;"></span>
      <h2 data-t="work_title" style="font-family:'Frank Ruhl Libre',serif;font-size:46px;font-weight:300;letter-spacing:-.02em;margin:0;"></h2>
    </div>

    <div style="position:relative;width:100%;margin-top:56px;">
      <div id="tiltZone" style="position:relative;width:100%;height:440px;perspective:1700px;perspective-origin:50% 45%;">
        <div id="tiltInner" style="position:absolute;inset:0;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.22,1,.36,1);">
          <div id="cardsContainer"></div>
        </div>

        <div style="position:absolute;left:0;top:0;bottom:0;width:14%;pointer-events:none;background:linear-gradient(90deg,#0E100E 8%,rgba(14,16,14,0));"></div>
        <div style="position:absolute;right:0;top:0;bottom:0;width:14%;pointer-events:none;background:linear-gradient(270deg,#0E100E 8%,rgba(14,16,14,0));"></div>

        <button id="prevBtn" class="carousel-nav" style="position:absolute;left:5%;top:50%;margin-top:-23px;width:46px;height:46px;border:1px solid rgba(233,235,232,.18);background:rgba(21,24,21,.72);backdrop-filter:blur(14px);color:#E9EBE8;font-family:'IBM Plex Mono',monospace;font-size:17px;cursor:pointer;z-index:60;display:flex;align-items:center;justify-content:center;transition:background .3s,color .3s,border-color .3s;">‹</button>
        <button id="nextBtn" class="carousel-nav" style="position:absolute;right:5%;top:50%;margin-top:-23px;width:46px;height:46px;border:1px solid rgba(233,235,232,.18);background:rgba(21,24,21,.72);backdrop-filter:blur(14px);color:#E9EBE8;font-family:'IBM Plex Mono',monospace;font-size:17px;cursor:pointer;z-index:60;display:flex;align-items:center;justify-content:center;transition:background .3s,color .3s,border-color .3s;">›</button>
      </div>
    </div>

    <div style="position:relative;margin-top:44px;display:flex;align-items:center;justify-content:center;gap:24px;font-family:'IBM Plex Mono',monospace;">
      <div style="font-size:12px;letter-spacing:.12em;opacity:.55;"><span id="counter" style="color:#E9EBE8;opacity:1;"></span> / <span id="total"></span></div>
      <div id="dotsContainer" style="display:flex;align-items:center;gap:10px;"></div>
      <div id="statusLabel" style="font-size:11px;letter-spacing:.14em;text-transform:uppercase;opacity:.55;"></div>
    </div>

    <div id="testimonialsSection" style="max-width:1400px;margin:120px auto 0;padding:0 56px;display:none;">
      <div style="display:flex;align-items:baseline;gap:20px;margin-bottom:52px;">
        <span data-t="testimonials_label" data-prefix="03 / " style="font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#C9F7C5;"></span>
        <h2 data-t="testimonials_title" style="font-family:'Frank Ruhl Libre',serif;font-size:46px;font-weight:300;letter-spacing:-.02em;margin:0;"></h2>
      </div>
      <div style="border-top:1px solid rgba(233,235,232,.14);display:grid;grid-template-columns:300px 1fr;gap:0;">
        <div style="border-inline-end:1px solid rgba(233,235,232,.14);padding-block:44px;padding-inline-start:0;padding-inline-end:44px;">
          <div style="width:100%;height:300px;overflow:hidden;background:#151815;display:flex;align-items:center;justify-content:center;color:rgba(233,235,232,.35);font-size:13px;text-align:center;padding:12px;box-sizing:border-box;">
            <span id="testimonialPhotoLabel"></span>
          </div>
          <div id="testimonialPlaceholderLabel" style="font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;opacity:.5;margin-top:16px;"></div>
        </div>
        <div style="padding-block:44px;padding-inline-end:0;padding-inline-start:56px;display:flex;flex-direction:column;justify-content:space-between;min-height:344px;">
          <div>
            <span style="font-family:'Frank Ruhl Libre',serif;font-size:64px;line-height:.7;color:#C9F7C5;display:block;">"</span>
            <p style="font-family:'Frank Ruhl Libre',serif;font-weight:300;font-size:30px;line-height:1.5;letter-spacing:-.01em;margin:22px 0 0;max-width:34ch;opacity:.92;"><span id="testimonialQuote"></span></p>
          </div>
          <div style="display:flex;align-items:flex-end;justify-content:space-between;gap:32px;margin-top:36px;">
            <div>
              <div id="testimonialName" style="font-size:17px;font-weight:500;"></div>
              <div id="testimonialRole" style="font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.1em;color:#C9F7C5;margin-top:6px;"></div>
            </div>
            <div style="display:flex;gap:10px;">
              <button id="testPrevBtn" class="testimonial-nav" style="width:44px;height:44px;border:1px solid rgba(233,235,232,.18);background:none;color:#E9EBE8;font-family:'IBM Plex Mono',monospace;font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .25s,color .25s,border-color .25s;">‹</button>
              <button id="testNextBtn" class="testimonial-nav" style="width:44px;height:44px;border:1px solid rgba(233,235,232,.18);background:none;color:#E9EBE8;font-family:'IBM Plex Mono',monospace;font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .25s,color .25s,border-color .25s;">›</button>
            </div>
          </div>
        </div>
      </div>
      <div style="height:1px;background:rgba(233,235,232,.14);"></div>
    </div>
  </section>

  <section id="process" style="position:relative;z-index:1;max-width:1400px;margin:0 auto;padding:130px 56px 0;overflow:hidden;">
    <div style="display:flex;align-items:baseline;gap:20px;">
      <span data-t="nav_process" data-prefix="04 / " style="font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#C9F7C5;"></span>
      <h2 data-t="process_title" style="font-family:'Frank Ruhl Libre',serif;font-size:46px;font-weight:300;letter-spacing:-.02em;margin:0;"></h2>
    </div>

    <div id="stepsWrap" style="position:relative;margin-top:64px;padding-bottom:20px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));column-gap:36px;align-items:start;">
      <div style="position:absolute;top:244px;left:0;right:0;height:1px;background:rgba(233,235,232,.14);"></div>
      <div id="spineFill" style="position:absolute;top:244px;inset-inline-start:0;height:1px;background:#C9F7C5;width:25%;transition:width 1.2s cubic-bezier(.2,.8,.2,1);"></div>
      <div id="stepsContainer" style="display:contents;"></div>

    const imgScale = isActive ? 'scale(1.06)' : 'scale(1)';
    const imgFilter = isActive ? 'grayscale(0) brightness(1)' : 'grayscale(.55) brightness(.6)';
    const titleOpacity = isActive ? 1 : 0.55;
    const bodyOpacity = isActive ? 0.82 : 0.66;
    const cardBorder = isActive ? '1px solid rgba(201,247,197,.55)' : '1px solid rgba(233,235,232,.14)';
    const cardBg = isActive ? '#171B17' : '#131613';
    const ruleWidth = isActive ? '100%' : '48px';
    const circleTransform = isActive ? 'scale(1.1)' : 'scale(1)';
    const circleBg = isActive ? '#C9F7C5' : (done ? 'rgba(201,247,197,.14)' : '#0E100E');
    const circleBorder = isActive ? '1px solid #C9F7C5' : (done ? '1px solid rgba(201,247,197,.5)' : '1px solid rgba(233,235,232,.2)');
    const circleTextColor = isActive ? '#0E100E' : (done ? '#C9F7C5' : '#E9EBE8');

    const col = document.createElement('div');
    col.setAttribute('data-step-index', i);
    col.style.cssText = 'position:relative;display:flex;flex-direction:column;cursor:pointer;opacity:1;transform:translateY(0);';
    col.addEventListener('click', () => { stepN = 0; activeStep = i; renderSteps(); updateSpine(); });
    col.innerHTML = `
      <div style="position:relative;flex:none;height:216px;border:${cardBorder};background:${cardBg};box-sizing:border-box;overflow:hidden;transition:border-color .7s ease,background .7s ease;">
        <img src="${imgs[type]}" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;transform:${imgScale};filter:${imgFilter};transition:transform 1.1s cubic-bezier(.2,.8,.2,1),filter .8s ease;">
        <span style="position:absolute;inset:0;background:linear-gradient(to top,rgba(14,16,14,.72),rgba(14,16,14,.18) 55%,rgba(14,16,14,.34));"></span>
        <span style="position:absolute;inset-inline-end:14px;bottom:-18px;font-family:'Frank Ruhl Libre',serif;font-weight:300;font-size:92px;color:rgba(233,235,232,.05);line-height:1;">${n}</span>
      </div>
      <div style="flex:none;height:56px;display:flex;align-items:center;">
        <div style="width:52px;height:52px;display:flex;align-items:center;justify-content:center;background:${circleBg};border:${circleBorder};transform:${circleTransform};transition:transform .7s cubic-bezier(.2,.8,.2,1),background .7s ease,border-color .7s ease;">
          <span style="font-family:'IBM Plex Mono',monospace;font-size:14px;letter-spacing:.06em;color:${circleTextColor};">${n}</span>
        </div>
      </div>
      <div style="padding-top:22px;">
        <h3 style="margin:0;font-family:'Frank Ruhl Libre',serif;font-size:28px;font-weight:300;letter-spacing:-.02em;opacity:${titleOpacity};transition:opacity .7s ease;">${tr['step' + (i + 1) + '_title']}</h3>
        <div style="height:2px;background:#C9F7C5;margin:16px 0;width:${ruleWidth};transition:width .8s cubic-bezier(.2,.8,.2,1);"></div>
        <p style="margin:0;font-size:15px;line-height:1.75;opacity:${bodyOpacity};transition:opacity .7s ease;">${tr['step' + (i + 1) + '_body']}</p>
      </div>`;
    stepsContainer.appendChild(col);
  });
}

function updateSpine() {
  spineFillEl.style.width = (((activeStep + 1) / 4) * 100) + '%';
}

function renderCards() {
  const tr = t();
  cardsContainer.innerHTML = '';
  workData.forEach((it, i) => {
    const o = offsetOfWork(i);
    const active = o === 0;
    const url = tr[it.key + '_url'];
    const card = document.createElement('div');
    card.style.cssText = workCardCss(o);
    card.addEventListener('click', () => {
      if (!active) { progressVal = 0; index = i; render(); }
      else window.open(url, '_blank', 'noopener,noreferrer');
    });

    const sheenOpacity = active ? 1 : 0;
    const captionTransform = active ? 'translateY(0)' : 'translateY(14px)';
    const captionOpacity = active ? 1 : 0;
    const veilOpacity = active ? 0 : 1;

    card.innerHTML = `
      <div style="position:absolute;inset:0;overflow:hidden;background:#151815;">
        <div role="img" aria-label="${tr[it.key + '_name']}" style="position:absolute;inset:0;background-image:url('${it.img}');background-size:cover;background-position:top center;animation:mKen 26s ease-in-out infinite alternate;"></div>
        <div style="position:absolute;inset:0;background:linear-gradient(to top, rgba(14,16,14,.92) 0%, rgba(14,16,14,.20) 46%, rgba(14,16,14,0) 72%);pointer-events:none;"></div>
        <div style="position:absolute;inset:0;overflow:hidden;pointer-events:none;opacity:${sheenOpacity};transition:opacity .8s ease;">
          <div style="position:absolute;top:-30%;left:0;width:20%;height:160%;background:linear-gradient(90deg, rgba(201,247,197,0), rgba(201,247,197,.14), rgba(201,247,197,0));animation:mSheen 8s cubic-bezier(.5,0,.3,1) infinite 1.6s;"></div>
        </div>
      </div>
      <div style="position:absolute;left:18px;right:18px;bottom:18px;height:76px;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 14px 0 22px;background:rgba(14,16,14,.72);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(233,235,232,.12);transform:${captionTransform};opacity:${captionOpacity};transition:transform .9s cubic-bezier(.16,1,.3,1) .12s, opacity .7s ease;">
        <div style="display:flex;flex-direction:column;gap:5px;min-width:0;">
          <div style="font-size:19px;font-weight:500;letter-spacing:-.01em;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${tr[it.key + '_name']}</div>
          <div style="font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#C9F7C5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${tr[it.key + '_tag']}</div>
        </div>
        <div class="work-arrow" style="flex:none;width:46px;height:46px;background:#C9F7C5;color:#0E100E;display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;font-size:17px;transition:transform .45s cubic-bezier(.16,1,.3,1);">↖</div>
      </div>
      <div style="position:absolute;inset:0;pointer-events:none;background:rgba(14,16,14,.6);opacity:${veilOpacity};transition:opacity .9s ease;"></div>
    `;
    cardsContainer.appendChild(card);
  });
}

function renderDots() {
  const tr = t();
  dotsContainer.innerHTML = '';
  workData.forEach((it, i) => {
    const isActive = i === index;
    const btn = document.createElement('button');
    btn.setAttribute('aria-label', tr[it.key + '_name']);
    btn.style.cssText = `position:relative;width:${isActive ? '44px' : '8px'};height:8px;padding:0;border:none;cursor:pointer;overflow:hidden;background:rgba(233,235,232,.20);transition:width .8s cubic-bezier(.16,1,.3,1), background .4s;`;
    btn.addEventListener('click', () => { progressVal = 0; index = i; render(); });
    const fill = document.createElement('span');
    fill.style.cssText = 'position:absolute;left:0;top:0;bottom:0;background:#C9F7C5;width:0%;transition:width .12s linear;';
    if (isActive) fill.id = 'activeFill';
    btn.appendChild(fill);
    dotsContainer.appendChild(btn);
  });
}

function renderTestimonial() {
  const tr = t();
  document.getElementById('testimonialPlaceholderLabel').textContent = tr.quote_placeholder;
  document.getElementById('testimonialQuote').textContent = tr['test' + (index + 1) + '_quote'];
  document.getElementById('testimonialName').textContent = tr['test' + (index + 1) + '_name'];
  document.getElementById('testimonialRole').textContent = tr['test' + (index + 1) + '_role'];
  document.getElementById('testimonialPhotoLabel').textContent = tr.photo_placeholder;
}

function applyTranslations() {
  const tr = t();
  document.querySelectorAll('[data-t]').forEach((el) => {
    const key = el.getAttribute('data-t');
    const prefix = el.getAttribute('data-prefix') || '';
    if (tr[key] !== undefined) el.textContent = prefix + tr[key];
  });
  document.querySelectorAll('[data-t-alt]').forEach((el) => {
    const key = el.getAttribute('data-t-alt');
    if (tr[key] !== undefined) el.setAttribute('alt', tr[key]);
  });
  document.getElementById('heroTitleA').textContent = tr.hero_title_a;
  document.getElementById('heroTitleMark').textContent = tr.hero_title_mark;
  document.getElementById('heroTitleB').textContent = tr.hero_title_b;
  document.getElementById('location').textContent = tr.location;
  document.getElementById('location2').textContent = tr.location;
  document.getElementById('availability').textContent = tr.availability;
  document.getElementById('counter').textContent = String(index + 1).padStart(2, '0');
  document.getElementById('total').textContent = String(workData.length).padStart(2, '0');
  document.getElementById('statusLabel').textContent = hover ? tr.status_paused : tr.status_auto;
  document.getElementById('copyright').textContent = tr.copyright;
  document.getElementById('fab').setAttribute('aria-label', tr.fab_label);
}

function applyTilt() {
  tiltInner.style.transform = 'rotateY(' + (mx * 4).toFixed(2) + 'deg) rotateX(' + (-my * 2.4).toFixed(2) + 'deg)';
}

function render() {
  rootEl.setAttribute('dir', t().dir);
  rootEl.setAttribute('lang', t().langCode);
  applyTranslations();
  renderCards();
  renderDots();
  renderTestimonial();
  applyTilt();
}

document.getElementById('langToggle').addEventListener('click', () => {
  lang = lang === 'he' ? 'en' : 'he';
  render();
});
document.getElementById('prevBtn').addEventListener('click', () => goWork(-1));
document.getElementById('nextBtn').addEventListener('click', () => goWork(1));
document.getElementById('testPrevBtn').addEventListener('click', () => goWork(-1));
document.getElementById('testNextBtn').addEventListener('click', () => goWork(1));

tiltZone.addEventListener('mouseenter', () => { hover = true; applyTranslations(); });
tiltZone.addEventListener('mouseleave', () => { hover = false; mx = 0; my = 0; applyTranslations(); applyTilt(); });
tiltZone.addEventListener('mousemove', (e) => {
  const r = tiltZone.getBoundingClientRect();
  mx = (e.clientX - r.left) / r.width - .5;
  my = (e.clientY - r.top) / r.height - .5;
  applyTilt();
});
stepsWrapEl.addEventListener('mouseenter', () => { procHover = true; });
stepsWrapEl.addEventListener('mouseleave', () => { procHover = false; });

window.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight') goWork(lang === 'he' ? -1 : 1);
  if (e.key === 'ArrowLeft') goWork(lang === 'he' ? 1 : -1);
});

/* Scroll: nav shrink + reveal-on-scroll */
function onScroll() {
  const on = window.scrollY > 12;
  navEl.style.background = on ? 'rgba(14,16,14,.82)' : 'rgba(14,16,14,0)';
  navEl.style.backdropFilter = on ? 'blur(16px)' : 'none';
  navEl.style.borderBottomColor = on ? 'rgba(233,235,232,.14)' : 'rgba(233,235,232,.10)';
  navEl.style.paddingTop = on ? '15px' : '22px';
  navEl.style.paddingBottom = on ? '15px' : '22px';

  const line = window.innerHeight * 0.92;
  document.querySelectorAll('[data-reveal]').forEach((el) => {
    if (el.getBoundingClientRect().top < line) {
      el.style.opacity = '1';
      el.style.transform = 'translateY(0)';
    }
  });
}
window.addEventListener('scroll', onScroll, { passive: true });

function armReveals() {
  const line = window.innerHeight * 0.92;
  document.querySelectorAll('[data-reveal]').forEach((el) => {
    if (el.getBoundingClientRect().top >= line) {
      el.style.opacity = '0';
      el.style.transform = 'translateY(24px)';
    }
  });
  onScroll();
}

/* Work carousel autoplay + process step cycling */
setInterval(() => {
  if (!procHover) {
    const r = stepsWrapEl.getBoundingClientRect();
    if (r.top < window.innerHeight && r.bottom > 0) {
      stepN++;
      if (stepN % 90 === 0) { activeStep = (activeStep + 1) % 4; renderSteps(); updateSpine(); }
    }
  }
  if (hover) return;
  const dur = 5500;
  progressVal += 50 / dur;
  if (progressVal >= 1) {
    progressVal = 0;
    index = (index + 1) % workData.length;
    render();
  } else {
    const fill = document.getElementById('activeFill');
    if (fill) fill.style.width = (progressVal * 100) + '%';
  }
}, 50);

/* Hero particle field */
(function () {
  const cv = fieldCanvas;
  const ctx = cv.getContext('2d');
  if (!ctx) return;
  const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const opaqueEls = ['about', 'contact'].map((id) => document.getElementById(id)).filter(Boolean);
  const field = { w: 0, h: 0, pts: [], mx: 0, my: 0, tx: 0, ty: 0, t: 0, blobs: [] };

  function seed() {
    const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
    field.w = Math.max(1, window.innerWidth); field.h = Math.max(1, window.innerHeight);
    cv.width = Math.round(field.w * dpr); cv.height = Math.round(field.h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const dens = 1.2;
    const cap = field.w < 640 ? 55 : 110;
    const n = Math.max(28, Math.min(cap, Math.round((field.w * field.h) / 11000 * dens)));
    field.pts = new Array(n).fill(0).map(() => {
      const hub = Math.random() < .12;
      return {
        x: Math.random() * field.w, y: Math.random() * field.h,
        vx: (Math.random() - .5) * .3, vy: (Math.random() - .5) * .24,
        r: hub ? 2.2 + Math.random() * 1.6 : .8 + Math.random() * 1.3,
        a: hub ? .55 + Math.random() * .35 : .2 + Math.random() * .4,
        d: .4 + Math.random() * 1.5, hub: hub, near: 0
      };
    });
    field.blobs = [
      { x: .22, y: .3, r: .55, a: .13, sx: .00007, sy: .00005, p: 0 },
      { x: .78, y: .22, r: .48, a: .11, sx: -.00006, sy: .00008, p: 2 },
      { x: .55, y: .82, r: .6, a: .09, sx: .00005, sy: -.00006, p: 4 }
    ];
    field.t = 0;
  }

  function draw(move) {
    const prog = Math.min(1, (window.scrollY || 0) / Math.max(1, window.innerHeight));
    const ease = prog * prog * (3 - 2 * prog);
    const motion = 1 - .6 * ease;
    const heroF = 1 - ease;
    cv.style.opacity = (1 - .75 * ease).toFixed(3);
    ctx.clearRect(0, 0, field.w, field.h);
    if (move) field.t += motion;
    field.mx += (field.tx - field.mx) * .05;
    field.my += (field.ty - field.my) * .05;

    for (let b = 0; b < field.blobs.length; b++) {
      const bl = field.blobs[b];
      const cx = (bl.x + Math.sin(field.t * bl.sx * 12 + bl.p) * .07) * field.w + field.mx * 34;
      const cy = (bl.y + Math.cos(field.t * bl.sy * 12 + bl.p) * .06) * field.h + field.my * 22;
      const rad = bl.r * Math.max(field.w, field.h) * .62;
      const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, rad);
      g.addColorStop(0, 'rgba(201,247,197,' + bl.a + ')');
      g.addColorStop(.45, 'rgba(201,247,197,' + (bl.a * .28).toFixed(3) + ')');
      g.addColorStop(1, 'rgba(201,247,197,0)');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, field.w, field.h);
    }

    const pts = field.pts;
    const ptrX = (field.tx * .5 + .5) * field.w, ptrY = (field.ty * .5 + .5) * field.h;
    for (let i = 0; i < pts.length; i++) {
      const p = pts[i];
      if (move) {
        p.x += p.vx * motion; p.y += p.vy * motion;
        if (p.x < -20) p.x = field.w + 20; else if (p.x > field.w + 20) p.x = -20;
        if (p.y < -20) p.y = field.h + 20; else if (p.y > field.h + 20) p.y = -20;
      }
      p.px = p.x + field.mx * p.d * 30;
      p.py = p.y + field.my * p.d * 20;
      const ddx = p.px - ptrX, ddy = p.py - ptrY;
      p.near = heroF * Math.max(0, 1 - Math.sqrt(ddx * ddx + ddy * ddy) / 320);
    }

    pts.sort((a2, b2) => a2.px - b2.px);
    ctx.lineWidth = 1;
    for (let i = 0; i < pts.length; i++) {
      for (let j = i + 1; j < pts.length; j++) {
        const dx = pts[j].px - pts[i].px;
        if (dx > 170) break;
        const dy = pts[i].py - pts[j].py;
        const d2 = dx * dx + dy * dy;
        if (d2 < 28900) {
          const tt = 1 - Math.sqrt(d2) / 170;
          const boost = 1 + 2.6 * Math.max(pts[i].near, pts[j].near);
          ctx.strokeStyle = 'rgba(201,247,197,' + Math.min(.5, .13 * tt * boost).toFixed(3) + ')';
          ctx.beginPath(); ctx.moveTo(pts[i].px, pts[i].py); ctx.lineTo(pts[j].px, pts[j].py); ctx.stroke();
        }
      }
    }

    for (let i = 0; i < pts.length; i++) {
      const p = pts[i];
      const a = Math.min(1, p.a * (1 + 1.1 * p.near));
      if (p.hub) {
        const gr = p.r * 7 + 10 * p.near;
        const hg = ctx.createRadialGradient(p.px, p.py, 0, p.px, p.py, gr);
        hg.addColorStop(0, 'rgba(201,247,197,' + (.34 + .3 * p.near).toFixed(3) + ')');
        hg.addColorStop(1, 'rgba(201,247,197,0)');
        ctx.fillStyle = hg;
        ctx.beginPath(); ctx.arc(p.px, p.py, gr, 0, 6.2832); ctx.fill();
        ctx.strokeStyle = 'rgba(201,247,197,' + (.16 + .3 * p.near).toFixed(3) + ')';
        ctx.beginPath(); ctx.arc(p.px, p.py, p.r * 4.5 + 6 * p.near, 0, 6.2832); ctx.stroke();
      }
      ctx.fillStyle = 'rgba(201,247,197,' + a.toFixed(3) + ')';
      ctx.beginPath(); ctx.arc(p.px, p.py, p.r * (1 + .5 * p.near), 0, 6.2832); ctx.fill();
    }
  }

  seed();
  draw(false);
  if (reduced) return;

  window.addEventListener('pointermove', (e) => {
    field.tx = (e.clientX / window.innerWidth - .5) * 2;
    field.ty = (e.clientY / window.innerHeight - .5) * 2;
  }, { passive: true });

  window.addEventListener('resize', () => { seed(); draw(false); }, { passive: true });

  function covers() {
    const vh = window.innerHeight;
    for (let i = 0; i < opaqueEls.length; i++) {
      const r = opaqueEls[i].getBoundingClientRect();
      if (r.top <= 0 && r.bottom >= vh) return true;
    }
    return false;
  }
  let n = 0, live = true;
  function loop() {
    if ((n++ & 7) === 0) live = document.visibilityState !== 'hidden' && !covers();
    if (live) draw(true);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();

let resizeTimer;
function scheduleCardsResize() {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(renderCards, 150);
}
window.addEventListener('resize', scheduleCardsResize);
function resetViewportZoom() {
  const vp = document.querySelector('meta[name="viewport"]');
  if (!vp) return;
  const original = vp.getAttribute('content');
  vp.setAttribute('content', original + ', maximum-scale=1');
  requestAnimationFrame(() => vp.setAttribute('content', original));
}

window.addEventListener('orientationchange', () => {
  renderCards();
  resetViewportZoom();
  setTimeout(() => { renderCards(); resetViewportZoom(); }, 100);
  setTimeout(() => { renderCards(); resetViewportZoom(); }, 400);
});

render();
renderSteps();
updateSpine();
requestAnimationFrame(armReveals);
</script>
</body>
</html>
